<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Deltarune Lightners Live</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	width: 100%;
	height: 100%;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
	position: absolute;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%);
	width: min(100vw, calc(100vh * 16 / 9));
	height: min(100vh, calc(100vw * 9 / 16));
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice, #status-label {
	display: none;
}

#status-label {
	position: absolute;
	left: 0;
	right: 0;
	bottom: calc(10% + 16px);
	text-align: center;
	color: #e0e0e0;
	font: 600 15px/1.2 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	letter-spacing: .03em;
	text-shadow: 0 1px 3px #000;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* ---- touch controls overlay ---- */
#tc { display: none; position: fixed; inset: 0; z-index: 2147483000; pointer-events: none; color: #fff;
	font: 700 14px/1 'Noto Sans', 'Droid Sans', Arial, sans-serif; letter-spacing: .04em;
	-webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none;
	--s: clamp(54px, 15vmin, 88px); --pad: max(14px, env(safe-area-inset-left)); --padr: max(14px, env(safe-area-inset-right));
	--pb: max(14px, env(safe-area-inset-bottom)); }
#tc.on { display: block; }
#tc.hide .b:not(.tg) { display: none; }
#tc .b { position: absolute; pointer-events: auto; display: flex; align-items: center; justify-content: center;
	box-sizing: border-box; width: var(--s); height: var(--s); border-radius: 50%;
	background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.4);
	touch-action: none; -webkit-tap-highlight-color: transparent; font-size: 22px; }
#tc .b.d { background: rgba(255,255,255,.42); }
#tc .lane { width: calc(var(--s) * 1.45); height: calc(var(--s) * 1.45); font-size: 30px; }
#tc .l  { left: var(--pad);  bottom: var(--pb); }
#tc .r  { right: var(--padr); bottom: var(--pb); }
#tc .u  { left: calc(var(--pad) + var(--s) * .72 - var(--s) * .3);  bottom: calc(var(--pb) + var(--s) * 1.45 + 12px); width: calc(var(--s) * .8); height: calc(var(--s) * .8); font-size: 18px; }
#tc .dn { left: calc(var(--pad) + var(--s) * .72 - var(--s) * .3 + var(--s) * .8 + 10px); bottom: calc(var(--pb) + var(--s) * 1.45 + 12px); width: calc(var(--s) * .8); height: calc(var(--s) * .8); font-size: 18px; }
#tc .a  { right: calc(var(--padr) + var(--s) * .72 - var(--s) * .3); bottom: calc(var(--pb) + var(--s) * 1.45 + 12px); width: calc(var(--s) * .8); height: calc(var(--s) * .8); }
#tc .bk { right: calc(var(--padr) + var(--s) * .72 - var(--s) * .3 + var(--s) * .8 + 10px); bottom: calc(var(--pb) + var(--s) * 1.45 + 12px); width: calc(var(--s) * .8); height: calc(var(--s) * .8); }
#tc .esc, #tc .c { top: max(10px, env(safe-area-inset-top)); width: auto; height: 32px; padding: 0 14px; border-radius: 16px; font-size: 12px; }
#tc .esc { right: var(--padr); }
#tc .c   { right: calc(var(--padr) + 78px); }
#tc .tg  { top: max(10px, env(safe-area-inset-top)); left: var(--pad); width: 34px; height: 34px; font-size: 15px; opacity: .6; }

/* ---- CSS-drawn icons (replace emojis) ---- */
/* Triangles for arrow buttons */
#tc .b.arr::before { content: ""; display: block; width: 0; height: 0; border-style: solid; }
#tc .l.arr::before  { border-width: 13px 20px 13px 0; border-color: transparent #fff transparent transparent; margin-left: -4px; }
#tc .r.arr::before  { border-width: 13px 0 13px 20px; border-color: transparent transparent transparent #fff; margin-left: 4px; }
#tc .u.arr::before  { border-width: 0 11px 16px 11px; border-color: transparent transparent #fff transparent; margin-top: -3px; }
#tc .dn.arr::before { border-width: 16px 11px 0 11px; border-color: #fff transparent transparent transparent; margin-top: 3px; }

/* Menu/pause icon: two vertical bars */
#tc .esc::before { content: ""; display: inline-block; width: 4px; height: 12px; background: #fff;
	border-radius: 1px; box-shadow: 7px 0 0 #fff; margin-right: 11px; vertical-align: middle; }
#tc .esc { display: inline-flex; gap: 0; }

/* Toggle icon: 3 horizontal bars (hamburger) */
#tc .tg::before { content: ""; display: block; width: 16px; height: 2px; background: #fff; border-radius: 1px;
	box-shadow: 0 -5px 0 #fff, 0 5px 0 #fff; }

/* A/B/C buttons: styled letter (no emoji) */
#tc .a, #tc .bk, #tc .c { font-family: 'Noto Sans', Arial, sans-serif; font-weight: 800; }

	<body>

		</canvas>

		<noscript>

		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="https://cdn.jsdelivr.net/gh/CoreScripts/lightners-live-plus@main/index.png" crossorigin="anonymous" alt="">
			<progress id="status-progress"></progress>

		<div id="tc" aria-hidden="true">
			<div class="b tg" data-toggle="1"></div>
			<div class="b lane l arr" data-key="ArrowLeft"></div>
			<div class="b lane r arr" data-key="ArrowRight"></div>
			<div class="b u arr" data-key="ArrowUp"></div>
			<div class="b dn arr" data-key="ArrowDown"></div>
			<div class="b a" data-key="KeyZ">A</div>
			<div class="b bk" data-key="KeyX">B</div>
			<div class="b c" data-key="KeyC">C</div>
			<div class="b esc" data-key="Escape">ESC</div>
		</div>

		<script>
/* -----------------------------------------------------------------------------
   Touch controls: sends keyboard events to the game canvas. Bindings come from the game's input map:
   lanes = Left/Right (also A/D, Z/X), menus = arrows + Z (confirm) + X (cancel), Esc = pause.
   Shown on touch devices once the game has started; ?controls=0 hides them, ?controls=1 forces them.
   ----------------------------------------------------------------------------- */
window.__tc = (function () {
	const KEYS = {
		ArrowLeft: ['ArrowLeft', 37], ArrowRight: ['ArrowRight', 39], ArrowUp: ['ArrowUp', 38], ArrowDown: ['ArrowDown', 40],
		KeyZ: ['z', 90], KeyX: ['x', 88], KeyC: ['c', 67], Escape: ['Escape', 27],
	};
	const root = document.getElementById('tc');
	const canvas = document.getElementById('canvas');
	const q = new URLSearchParams(location.search).get('controls');
	const ipadAsMac = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1; // iPadOS reports a Mac
	const touch = ipadAsMac || (window.matchMedia && matchMedia('(pointer: coarse)').matches) || navigator.maxTouchPoints > 0 || 'ontouchstart' in window;
	const wanted = q === '1' ? true : q === '0' ? false : touch;
	const held = {};          // code -> element currently holding it

	function fire(type, code) {
		const info = KEYS[code];
		const ev = new KeyboardEvent(type, { key: info[0], code: code, keyCode: info[1], which: info[1], bubbles: true, cancelable: true });
		canvas.dispatchEvent(ev);
	}
	function press(el) {
		const code = el.dataset.key;
		if (!code || held[code]) return;
		held[code] = el;
		el.classList.add('d');
		canvas.focus();
		fire('keydown', code);
		if (navigator.vibrate) navigator.vibrate(8);
	}
	function release(el) {
		const code = el.dataset.key;
		if (!code || held[code] !== el) return;
		delete held[code];
		el.classList.remove('d');
		fire('keyup', code);
	}
	function releaseAll() { Object.keys(held).forEach((c) => release(held[c])); }

	root.addEventListener('pointerdown', (e) => {
		const el = e.target.closest('.b');
		if (!el) return;
		e.preventDefault();
		if (el.dataset.toggle) { root.classList.toggle('hide'); releaseAll(); return; }
		try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
		press(el);
	});
	['pointerup', 'pointercancel', 'lostpointercapture'].forEach((t) => {
		root.addEventListener(t, (e) => { const el = e.target.closest('.b'); if (el) release(el); });
	});
	root.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
	root.addEventListener('contextmenu', (e) => e.preventDefault());
	window.addEventListener('blur', releaseAll);
	document.addEventListener('visibilitychange', releaseAll);

	// Show right away (not only after the game starts) so they are there while it loads, too.
	if (wanted) root.classList.add('on');
	console.info('[lightners-live] touch controls:', wanted ? 'on' : 'off', '(touch device:', touch + ', ?controls=' + q + ')');

	return {
		show() { if (wanted) root.classList.add('on'); },
		wanted: wanted,
	};
})();

</script>
		<script>
/* -----------------------------------------------------------------------------
   Where the game files live. jsDelivr is tried first; it refuses very large files
   (index.side.wasm is 40 MB, the pack parts are 40 MB each), so each group of files comes
   from the first host below that can serve all of it.
   Tip: replace "main" with a commit SHA to pin a version.
   ----------------------------------------------------------------------------- */
const BASES = [
	'https://cdn.jsdelivr.net/gh/CoreScripts/lightners-live-plus@main/',
	'https://corescripts.github.io/lightners-live-plus/',
	'https://rawcdn.githack.com/CoreScripts/lightners-live-plus/main/',
	'https://raw.githubusercontent.com/CoreScripts/lightners-live-plus/main/',
];
const SERVICE_WORKER = 'sw.js'; // must sit next to this HTML file (it is in the repo already); see notes
const BUILD_ID = '1';           // bump when you push a new export, so cached copies are replaced
const PCK_PARTS = [
	{ name: 'index.pck.part01', size: 40000000 },
	{ name: 'index.pck.part02', size: 40000000 },
	{ name: 'index.pck.part03', size: 40000000 },
	{ name: 'index.pck.part04', size: 32585384 },
];
const PCK_TOTAL = PCK_PARTS.reduce((sum, p) => sum + p.size, 0); // 152585384
const MIDI_LIB = 'libgodotmidi.web.template_release.wasm32.wasm';
// Exact file sizes: they drive the percentage label and let every download go straight into a fixed buffer.
const SIZES = { js: 5724461, wasm: 1605674, side: 40325757, midi: 1145892 };
const TOTAL_BYTES = SIZES.js + SIZES.wasm + SIZES.side + SIZES.midi + PCK_TOTAL; // 201387168

const GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{},"focusCanvas":true,"gdextensionLibs":[MIDI_LIB],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = true;

(async function () {
	let swError = null;
	// The game uses threads, which the browser only allows on a "cross-origin isolated" page.
	// The service worker adds the required headers to this page, exactly like the original index.html.
	if ('serviceWorker' in navigator) {
		try {
			await navigator.serviceWorker.register(SERVICE_WORKER);
			if (!navigator.serviceWorker.controller) {
				await new Promise(function (resolve) {
					navigator.serviceWorker.addEventListener('controllerchange', resolve, { once: true });
				});
				window.location.reload();
				return;
			}
			navigator.serviceWorker.addEventListener('controllerchange', function () {
				window.location.reload();
			});
		} catch (err) {
			swError = err;
			console.error('Service worker registration failed:', err);
		}
	}

	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusLabel = document.getElementById('status-label');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusLabel.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text, link) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
		if (link) {
			const a = document.createElement('a');
			a.href = link.href;
			a.target = '_top';
			a.textContent = link.text;
			a.style.color = '#ffd9df';
			statusNotice.appendChild(a);
		}
	}

	function displayFailureNotice(err, link) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message, link);
		} else if (typeof err === 'string') {
			setStatusNotice(err, link);
		} else {
			setStatusNotice('An unknown error occurred.', link);
		}
		setStatusMode('notice');
		initializing = false;
	}

	function isolationReason() {
		if (window.top !== window.self) {
			return 'this page is inside an iframe. A threaded game only runs when the embedding page is itself cross-origin isolated, so open this page directly in its own tab (or use the link below).';
		}
		if (location.protocol === 'file:') {
			return 'the page was opened from disk (file://). Service workers need http(s); host the file or use the link below.';
		}
		if (!window.isSecureContext) {
			return 'this page is not served over https, so the browser disables service workers. Use https.';
		}
		if (!('serviceWorker' in navigator)) {
			return 'service workers are unavailable in this browser mode (e.g. private browsing in some browsers).';
		}
		if (swError) {
			return `"${SERVICE_WORKER}" could not be registered (${swError.message}). This HTML file must be hosted in the same folder as ${SERVICE_WORKER}; or send the headers Cross-Origin-Opener-Policy: same-origin and Cross-Origin-Embedder-Policy: require-corp.`;
		}
		return `"${SERVICE_WORKER}" is registered but this page is still not isolated. Hard-refresh once (Ctrl+Shift+R) so the service worker controls the page; if it persists, the copy of ${SERVICE_WORKER} on your site may be outdated.`;
	}

	/* ---- progress: one percentage across every download ---- */
	const loaded = {};            // file name -> bytes received
	let stage = 'download';       // 'download' | 'start'
	let renderQueued = false;

	function setLabel(text) { statusLabel.textContent = text; }
	function render() {
		renderQueued = false;
		let done = 0;
		for (const k in loaded) done += Math.max(0, loaded[k]);
		statusProgress.max = TOTAL_BYTES;
		statusProgress.value = Math.min(done, TOTAL_BYTES);
		if (stage === 'download') {
			// Never show 100% until everything has really arrived.
			setLabel('Loading ' + Math.min(99, Math.floor(done / TOTAL_BYTES * 100)) + '%');
		}
	}
	function bump(name, delta) {
		loaded[name] = (loaded[name] || 0) + delta;
		if (!renderQueued) {
			renderQueued = true;
			requestAnimationFrame(render);
		}
	}
	function startPhase() {
		stage = 'start';
		statusProgress.value = statusProgress.max = TOTAL_BYTES;
		setLabel('Starting game…');
	}

	/* ---- cache: after the first visit the ~200 MB comes from disk, not the network ---- */
	const nativeFetch = window.fetch.bind(window);
	let cache = null;
	const CACHE_NAME = 'lightners-live-' + BUILD_ID;
	const cacheKey = (name) => 'https://lightners-live.local/' + name;

	async function openCache() {
		if (!('caches' in window)) return null;
		try {
			for (const k of await caches.keys()) {
				if (k.startsWith('lightners-live-') && k !== CACHE_NAME) await caches.delete(k);
			}
			return await caches.open(CACHE_NAME);
		} catch (e) {
			return null; // private mode / file:// : everything still works, just uncached
		}
	}
	async function cacheHas(name) {
		try { return !!(cache && await cache.match(cacheKey(name))); } catch (e) { return false; }
	}

	/* ---- picking hosts ---- */
	async function headOk(url) {
		try {
			const ctl = new AbortController();
			const timer = setTimeout(() => ctl.abort(), 8000);
			const res = await nativeFetch(url, { method: 'HEAD', signal: ctl.signal });
			clearTimeout(timer);
			return res.ok;
		} catch (e) {
			return false;
		}
	}

	// First base (in priority order) that can serve every listed file.
	async function pickBase(files) {
		const oks = await Promise.all(BASES.map(async (base) => {
			const each = await Promise.all(files.map((f) => headOk(base + f)));
			return each.every(Boolean);
		}));
		const i = oks.indexOf(true);
		return i < 0 ? null : BASES[i];
	}

	const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

	/* ---- downloads ---- */
	// Reads `name` into buf[start .. start+size): cache first, otherwise from `base`, resuming with a
	// Range request if the connection drops. Progress is reported to the shared percentage.
	function fetchInto(name, base, buf, start, size) {
		const key = cacheKey(name);
		const st = { pos: 0 };
		let teed = false; // true while a full response is being saved to the cache as it downloads
		const undo = () => { bump(name, -st.pos); st.pos = 0; };

		async function pump(resp) {
			const reader = resp.body.getReader();
			for (;;) {
				const r = await reader.read();
				if (r.done) return;
				if (st.pos + r.value.length > size) throw new Error(`Unexpected size for '${name}'`);
				buf.set(r.value, start + st.pos);
				st.pos += r.value.length;
				bump(name, r.value.length);
			}
		}
		async function fromCache() {
			if (!cache) return false;
			try {
				const hit = await cache.match(key);
				if (!hit) return false;
				await pump(hit);
				if (st.pos === size) return true;
				undo();
				await cache.delete(key);
				return false;
			} catch (e) {
				undo();
				return false;
			}
		}
		async function fromNetwork() {
			for (let attempt = 0; attempt <= 5; attempt++) {
				try {
					if (attempt) await sleep(Math.min(6000, 700 * attempt));
					const headers = st.pos > 0 ? { Range: `bytes=${st.pos}-${size - 1}` } : {};
					const resp = await nativeFetch(base + name, { headers });
					if (!resp.ok) throw new Error('HTTP ' + resp.status);
					if (st.pos > 0 && resp.status !== 206) undo(); // server ignored Range: start over
					teed = false;
					if (st.pos === 0 && cache && resp.status === 200) {
						teed = true;
						cache.put(key, resp.clone()).catch(() => {});
					}
					await pump(resp);
					if (st.pos !== size) throw new Error(`Unexpected size for '${name}'`);
					// A file that needed a retry was not saved while downloading: save it now (rare path).
					if (cache && !teed) cache.put(key, new Response(buf.slice(start, start + size))).catch(() => {});
					return;
				} catch (err) {
					teed = false;
					console.warn(`[lightners-live] ${name}: attempt ${attempt + 1} failed at ${st.pos} bytes:`, err);
					if (attempt === 5) throw new Error(`Failed loading file '${name}'`);
				}
			}
		}
		return fromCache().then((ok) => (ok ? undefined : fromNetwork()));
	}

	function download(name, base, size) {
		let buf;
		try {
			buf = new Uint8Array(size);
		} catch (e) {
			return Promise.reject(new Error('Not enough free memory to load the game.\nClose other tabs or apps and reload.'));
		}
		return fetchInto(name, base, buf, 0, size).then(() => buf);
	}

	// Small text files (engine script, audio worklets): cached, with host fallback.
	async function getText(name, firstBase) {
		if (cache) {
			try {
				const hit = await cache.match(cacheKey(name));
				if (hit) return await hit.text();
			} catch (e) { /* fall through to the network */ }
		}
		const order = [firstBase].concat(BASES.filter((b) => b !== firstBase));
		for (const base of order) {
			try {
				const res = await nativeFetch(base + name);
				if (!res.ok) continue;
				const copy = res.clone();
				const text = await res.text();
				if (cache) cache.put(cacheKey(name), copy).catch(() => {});
				return text;
			} catch (e) { /* try the next host */ }
		}
		throw new Error(`Failed loading file '${name}'`);
	}

	// Everything big starts downloading at once, in parallel, while the engine script is still loading.
	function startBig(bigBase) {
		const wasm = download('index.wasm', bigBase, SIZES.wasm);
		const side = download('index.side.wasm', bigBase, SIZES.side);
		const midi = download(MIDI_LIB, bigBase, SIZES.midi);
		let pack = null;
		try {
			const buffer = new Uint8Array(PCK_TOTAL);
			let offset = 0;
			pack = Promise.all(PCK_PARTS.map((p) => {
				const job = fetchInto(p.name, bigBase, buffer, offset, p.size);
				offset += p.size;
				return job;
			})).then(() => buffer.buffer);
		} catch (e) {
			pack = Promise.reject(new Error('Not enough free memory to load the game (about ' + Math.round(PCK_TOTAL / 1048576) + ' MB needed).\nClose other tabs or apps and reload.'));
		}
		const big = { wasm, side, midi, pack };
		Object.values(big).forEach((p) => p.catch(() => {})); // errors surface where they are awaited
		return big;
	}

	// The engine fetches these by URL; hand it the bytes we already downloaded (and tracked) instead.
	function serveDownloads(big) {
		const served = { 'index.wasm': big.wasm, 'index.side.wasm': big.side };
		served[MIDI_LIB] = big.midi;
		window.fetch = function (input, init) {
			const url = typeof input === 'string' ? input : (input && input.url) || '';
			const file = url.split('?')[0].split('/').pop();
			if (Object.prototype.hasOwnProperty.call(served, file)) {
				return served[file].then((bytes) => new Response(bytes, {
					status: 200,
					headers: { 'Content-Type': 'application/wasm', 'Content-Length': String(bytes.length) },
				}));
			}
			return nativeFetch(input, init);
		};
	}

	// The engine is run from a blob: URL on purpose: its threads start as workers of that same script,
	// and a worker can only be created from a same-origin (or blob:) URL, never straight from a CDN.
	function loadEngineScript(text) {
		return new Promise((resolve, reject) => {
			const url = URL.createObjectURL(new Blob([text], { type: 'text/javascript' })); // never revoked: workers reuse it
			const script = document.createElement('script');
			script.src = url;
			script.onload = () => resolve();
			script.onerror = () => reject(new Error('Failed to start the engine script.'));
			document.head.appendChild(script);
		});
	}

	// Audio worklets are added from blob: URLs so they work whatever MIME type the host sends.
	function installWorkletLoader(firstBase) {
		if (typeof AudioWorklet === 'undefined') return;
		const origAdd = AudioWorklet.prototype.addModule;
		const memo = {};
		AudioWorklet.prototype.addModule = function (url, options) {
			const file = String(url).split('?')[0].split('/').pop();
			if (!file.endsWith('.worklet.js')) return origAdd.call(this, url, options);
			memo[file] ||= getText(file, firstBase).then((t) => URL.createObjectURL(new Blob([t], { type: 'text/javascript' })));
			return memo[file].then((blobUrl) => origAdd.call(this, blobUrl, options));
		};
	}

	/* ---- start ---- */
	setStatusMode('progress');
	setLabel('Loading 0%');
	try {
		cache = await openCache();

		// Skip the host probing entirely when everything is already on disk.
		const bigNames = ['index.wasm', 'index.side.wasm', MIDI_LIB].concat(PCK_PARTS.map((p) => p.name));
		const [jsCached, bigCached] = await Promise.all([
			cacheHas('index.js'),
			Promise.all(bigNames.map(cacheHas)).then((a) => a.every(Boolean)),
		]);
		const bases = await Promise.all([
			jsCached ? BASES[0] : pickBase(['index.js']),
			bigCached ? BASES[1] : pickBase(['index.side.wasm', 'index.pck.part01']),
		]);
		const smallBase = bases[0];
		const bigBase = bases[1];
		if (!smallBase) throw new Error('Could not reach any server hosting the game files.\nCheck your connection and reload.');
		if (!bigBase) throw new Error('None of the servers could provide the large game files (index.side.wasm / index.pck.*).\nCheck your connection and reload.');
		console.info('[lightners-live] engine from', smallBase, '| large files from', bigBase, '| cache:', cache ? (bigCached ? 'hit' : 'miss') : 'unavailable');

		// Only start the big downloads if this page can actually run the game (no point otherwise).
		let big = window.crossOriginIsolated ? startBig(bigBase) : null;

		const engineText = await getText('index.js', smallBase);
		bump('index.js', SIZES.js);
		await loadEngineScript(engineText);

		const missing = Engine.getMissingFeatures({
			threads: GODOT_THREADS_ENABLED,
		});
		if (missing.length !== 0) {
			let msg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n' + missing.join('\n');
			let link = null;
			if (!window.crossOriginIsolated) {
				msg += '\n\nWhy: ' + isolationReason();
				// If your own GitHub Pages copy of the game is live, offer it (it is isolated by its own sw.js).
				const pages = BASES[1];
				const here = location.href.split('?')[0];
				if (!here.startsWith(pages) && await headOk(pages + SERVICE_WORKER)) {
					msg += '\n\nA working copy of the game is available here:\n';
					link = { href: pages, text: pages };
				}
			}
			displayFailureNotice(msg, link);
			return;
		}
		big = big || startBig(bigBase);

		installWorkletLoader(smallBase);
		serveDownloads(big);

		const enginePath = bigBase + GODOT_CONFIG.executable; // e.g. https://host/path/index
		GODOT_CONFIG.fileSizes[enginePath + '.wasm'] = SIZES.wasm;
		const engine = new Engine(GODOT_CONFIG);

		const results = await Promise.all([engine.init(enginePath), big.pack]);
		startPhase();
		engine.config.args = ['--main-pack', 'index.pck'].concat(engine.config.args || []);
		await engine.preloadFile(results[1], 'index.pck');
		results.length = 0;
		await engine.start();
		big = null; // the engine now holds its own copies; let ours go
		setStatusMode('hidden');
		window.__tc.show(); // touch controls appear once the game is running
		try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignore */ }
	} catch (err) {
		displayFailureNotice(err);
	}
}());
</script>
	</body>
</html>
